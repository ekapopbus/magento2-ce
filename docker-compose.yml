services:
  mysql:
    image: mysql:8.0.33
    container_name: mysql-magento
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: magento2-ce
      MYSQL_USER: magento
      MYSQL_PASSWORD: magento
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/conf.d:/etc/mysql/conf.d
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - magento-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.0
    container_name: elasticsearch-magento
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
      # Works around a JDK 19 ARM64 SVE vector-length detection bug that crashes
      # with SIGILL under Docker Desktop's virtualization on Apple Silicon.
      - "JDK_JAVA_OPTIONS=-XX:UseSVE=0"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - magento-network
  
  kibana:
    container_name: "kibana"
    image: bitnami/kibana:8
    ports:
      - '5601:5601'
    environment:
      - KIBANA_ELASTICSEARCH_URL=elasticsearch
      - KIBANA_ELASTICSEARCH_PORT=9200
      - KIBANA_XPACK_SECURITY_ENCRYPTIONKEY=5f57c9c0a9a01a7b9136c2c2b8a3180d2f60a69eee81ac5ccf0274a7768de8d9
      - KIBANA_XPACK_REPORTING_ENCRYPTIONKEY=84c203b9c73a086fa997d9590f2dc6a38e90c05b4e2c8e001e4cd6af47408ee6
    networks:
      - magento-network
      - local
    # restart: always
    volumes:
      - 'kibana_data:/bitnami/kibana'
      - './docker/kibana/kibana.yml:/opt/bitnami/kibana/config/kibana.yml'
    depends_on:
      - elasticsearch

  opensearch:
    image: opensearchproject/opensearch:2.5.0
    container_name: opensearch-magento
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - plugins.security.disabled=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ports:
      - "9201:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - magento-network

  redis:
    image: redis:7.0-alpine
    container_name: redis-magento
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - magento-network

  php-fpm:
    build:
      context: ./docker/php-fpm
    container_name: php-fpm-magento
    restart: unless-stopped
    volumes:
      - ./:/var/www/html:cached
    working_dir: /var/www/html
    networks:
      - magento-network
    depends_on:
      - mysql
      - redis

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin-magento
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - magento-network

  nginx:
    image: nginx:1.27.3
    container_name: nginx-magento
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html:cached
      - ./local-services/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - php-fpm
      - elasticsearch
    networks:
      magento-network:
        aliases:
          - magento2-ce.local

volumes:
  mysql_data:
    driver: local
  elasticsearch_data:
    driver: local
  opensearch_data:
    driver: local
  redis_data:
    driver: local
  kibana_data:
    driver: local
networks:
  magento-network:
    driver: bridge
  local:
    name: local
    external: true