; pub/media is sshfs-mounted, a different filesystem from the container's
; local /tmp. PHP's default upload_tmp_dir (/tmp) causes rename() to fail
; with "Permission denied" when Magento moves an uploaded file into
; pub/media/tmp/... across filesystems. Point uploads at a dir inside the
; same sshfs mount so the move is same-filesystem.
upload_tmp_dir = /var/www/html/var/tmp_uploads
